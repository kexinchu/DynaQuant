# MoE-Quant Configuration Example

# Model settings
model:
  name: "Qwen/Qwen-MoE-14B"
  device: "cuda"
  torch_dtype: "float16"

# EBSS (Expert-Balanced Self-Sampling)
ebss:
  beam_width: 4
  tau: 1.2
  max_tokens: 512
  num_samples: 128
  min_perplexity: 1.0
  max_perplexity: 100.0
  expert_balance_weight: 1.0

# AGQ (Affinity-Guided Quantization)
agq:
  bit_width: 2
  group_size: 64
  symmetric: true
  use_affinity_weighting: true
  use_error_compensation: true
  iterations: 10
  damping: 0.01

# W2A2 Quantizer
w2a2:
  # Weight quantization
  w_bit: 2
  w_group_size: 64
  w_symmetric: true
  
  # Activation quantization
  a_bit: 2
  a_group_size: 64
  a_symmetric: false
  
  # Distribution shaping
  use_rotation: true
  use_whitening: true
  rotation_granularity: "per_layer"
  
  # Progressive fallback
  enable_fallback: true
  fallback_threshold: 0.05
  fallback_bits: [3, 4]

# Enhanced Router Guard
router_guard:
  mode: "fp16"  # fp16 | int8_acc32
  top_k: 2
  strict_topk: true
  consistency_threshold: 0.95
  deterministic_tiebreak: true
  tiebreak_epsilon: 1.0e-6
  enable_online_detection: true
  detection_window_size: 100
  detection_batch_size: 16
  enable_fallback: true
  fallback_on_first_flip: false

# PTQ settings
ptq:
  calibration:
    size: 128
    batch_size: 1
    max_seq_len: 512
  output_dir: "./output/ptq_moe"
  save_checkpoint: true

# QAT settings
qat:
  # Training
  num_epochs: 2
  learning_rate: 5.0e-6
  batch_size: 1
  gradient_accumulation_steps: 8
  max_grad_norm: 1.0
  weight_decay: 0.01
  
  # Loss weights
  lambda_topk: 1.0
  mu_margin: 0.2
  lambda_diversity: 0.1
  
  # Strategy
  freeze_experts: true
  train_router_adjacent_only: true
  
  # Output
  output_dir: "./output/qat_moe"
  save_every_epoch: true

# Evaluation settings
evaluation:
  batch_size: 1
  num_runs: 10
  metrics:
    - "topk_consistency"
    - "perplexity"
    - "latency"
    - "memory"
  output_path: "./output/eval_results.json"

# Data paths
data:
  seed_text: "./data/seed_text.txt"
  calibration_data: null
  train_data: null
  test_data: null

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true
  log_dir: "./logs"

