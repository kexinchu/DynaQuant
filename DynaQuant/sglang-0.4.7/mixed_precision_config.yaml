# 加载策略配置
loading_strategy:
  # 是否启用混合精度加载
  enabled: true

  # 基础模型精度（用于初始加载）
  base_precision: "fp8"

  # 内存优化策略
  memory_optimization:
    # 是否启用压缩权重缓存
    enable_cache: true
    # 缓存大小限制（MB）
    cache_size_limit: 1024
    # 是否启用动态反量化
    enable_dynamic_dequantization: true

# 推理配置
inference:
  max_seq_length: 4096
  max_batch_size: 32
  dtype: "bfloat16"
  device_map: "auto"

  # 混合精度特定配置
  mixed_precision:
    use_cache: true  # 是否使用权重缓存
    cache_size_mb: 1024  # 缓存大小限制
    enable_dynamic_dequantization: true  # 启用动态反量化

# 服务器配置
server:
  host: "127.0.0.1"
  port: 8080
  max_workers: 4

