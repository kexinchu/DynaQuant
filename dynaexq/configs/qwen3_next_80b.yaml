model:
  name: qwen3-next-80b-a3b-instruct
  layers: 48
  experts_per_layer: 512  # routed experts; the shared expert stays dense
  topk: 10

precision:
  hi: int4
  lo: int2
  backend: reference

scheduler:
  alpha: 0.9
  update_period_steps: 200
  rate_limit: null
  delta_score_margin: 0.01

memory:
  device_mem_bytes: 48000000000  # 48GB
  reserve_kv_bytes: 10000000000  # 10GB
  reserve_act_bytes: 2000000000  # 2GB
  reserve_dense_bytes: 5000000000  # lower bound; startup measures and raises it
  reserve_kernel_workspace_bytes: 0  # auto-sized from tier and concurrency
  safety_margin_bytes: 1000000000  # 1GB
  max_inflight: 4

experiments:
  concurrency: 64
  input_tokens: 2048
  output_tokens: 256
  shift_phases:
    - wikitext
    - gsm8k
    - humaneval
  phase_duration_s: 180
  cycles: 3
