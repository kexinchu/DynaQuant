model:
  name: phi-3.5-moe-instruct
  layers: 32
  experts_per_layer: 16
  topk: 2

precision:
  hi: fp16
  lo: int4
  backend: reference

scheduler:
  alpha: 0.9
  update_period_steps: 200
  rate_limit: null
  delta_score_margin: 0.01

memory:
  device_mem_bytes: 48000000000
  reserve_kv_bytes: 10000000000
  reserve_act_bytes: 2000000000
  reserve_dense_bytes: 5000000000
  reserve_kernel_workspace_bytes: 0
  safety_margin_bytes: 1000000000
  max_inflight: 4

experiments:
  concurrency: 64
  input_tokens: 2048
  output_tokens: 256
  shift_phases:
    - wikitext
    - gsm8k
    - humaneval
  phase_duration_s: 180
  cycles: 3
